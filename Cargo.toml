[workspace]
resolver = "3"
members = ["crates/nitro_core", "crates/nitro_py", "crates/nitro_bot"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
nitro_core = { path = "crates/nitro_core" }
# RocketSim v3, pinned. Upgrade only deliberately: an upgrade changes the games every bot trains in.
rocketsim = "=0.3.3"
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests build RocketSim optimised like the release build: unoptimised, `0.0f32.max(-0.0)` gives -0.0 instead
# of +0.0, so the tests would not check the games the shipped build plays.
[profile.dev.package.rocketsim]
opt-level = 1

[profile.dev.package.glam]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
# Panics must unwind so PyO3 can turn them into Python exceptions instead of killing the process.
panic = "unwind"
