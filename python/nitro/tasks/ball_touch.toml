# Practice task: touch a ball at rest. A lone car starts at rest 1000-3000 units from a resting ball; the
# episode ends when it touches the ball or after 10 seconds. Measured by touch rate and time to touch
# (nitro.tasks), never by the reward.

[env]
opponents = false
num_arenas = 512

[terminals]
no_touch_seconds = 0
max_episode_seconds = 10
end_on_touch = true

[[rewards]]
name = "touch_ball"
weight = 10

[[rewards]]
name = "velocity_player_to_ball"
weight = 1

[[rewards]]
name = "face_ball"
weight = 0.1

[[state_setters]]
name = "ball_touch"
min_distance_uu = 1000
max_distance_uu = 3000
