# Practice task (drill): 50/50s against the scripted ball-chaser. The ball at rest between the bot
# (Blue) and the scripted `chaser` (Orange), both at rest 1000-2000 units away facing it, with the same
# boost, so neither is nearer. An episode lasts 5 seconds or until a goal. Measured by the share of 50/50s
# won: the ball 2 seconds after the first touch more than 500 units nearer the chaser's goal than it
# started counts as won, more than 500 units nearer the bot's own goal as lost, anything else half
# (nitro.tasks), never by the reward. Needs an opponent (env.opponents = true).

[env]
num_arenas = 512

[terminals]
no_touch_seconds = 0
max_episode_seconds = 5

[[rewards]]
name = "velocity_player_to_ball"
weight = 1

[[rewards]]
name = "touch_ball"
weight = 5
zero_sum = { team_spirit = 0, opponent_scale = 1 }

[[rewards]]
name = "velocity_ball_to_goal"
weight = 5
zero_sum = { team_spirit = 1, opponent_scale = 1 }

[[state_setters]]
name = "fifty_fifty"
min_distance_uu = 1000
max_distance_uu = 2000
