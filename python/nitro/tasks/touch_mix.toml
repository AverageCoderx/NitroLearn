# Practice task: two touching skills in one bot, half the episodes each. Half the episodes are the ball-touch
# task's (a lone car at rest 1000-3000 units from a ball at rest on the floor), half the aerial-touch task's
# (a ball hanging 400-1000 units up, cut off when it comes down). Every episode ends when the car touches the
# ball and lasts at most 10 seconds. Measured per kind and together by the time to touch, a miss counting 10 s
# (nitro.tasks), never by the reward.

[env]
opponents = false
num_arenas = 512

[terminals]
no_touch_seconds = 0
max_episode_seconds = 10
end_on_touch = true
truncate_on_ball_landing = 1

[[rewards]]
name = "touch_ball"
weight = 10

[[rewards]]
name = "velocity_player_to_ball"
weight = 1

[[rewards]]
name = "face_ball"
weight = 0.1

[[state_setters]]
name = "ball_touch"
weight = 1
min_distance_uu = 1000
max_distance_uu = 3000

[[state_setters]]
name = "aerial_ball"
weight = 1
min_height_uu = 400
max_height_uu = 1000
max_ball_speed = 500
