# Practice task (drill): read a ball off a side wall. The ball rolls or bounces toward a side wall
# at 1000-2000 units per second from 600-1500 units off it, so it climbs the wall or comes back off it; a
# lone car waits at rest 1500-3000 units away on the field side, facing it. The episode ends when the car
# touches the ball, and lasts at most 6 seconds. Measured by time to touch (a miss counts 6 s) and touch
# rate (nitro.tasks), never by the reward.

[env]
opponents = false
num_arenas = 512

[terminals]
no_touch_seconds = 0
max_episode_seconds = 6
end_on_touch = true

[[rewards]]
name = "touch_ball"
weight = 10

[[rewards]]
name = "velocity_player_to_ball"
weight = 1

[[rewards]]
name = "face_ball"
weight = 0.1

[[state_setters]]
name = "wall_read"
min_speed = 1000
max_speed = 2000
